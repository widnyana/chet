[tools]
xcodegen = "2.46.0"

[tasks.gen]
description = "Generate chet.xcodeproj from project.yml"
run = "xcodegen generate --quiet"

[tasks.build]
description = "Debug build of the app into .build/xc"
depends = ["gen"]
run = [
  "xcodebuild -project chet.xcodeproj -scheme chet-helper -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/xc -quiet build",
  "xcodebuild -project chet.xcodeproj -scheme chet -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/xc -quiet build",
]

[tasks.dev]
description = "Build and launch the debug app with verbose logging (one LaunchServices registration only)"
depends = ["build"]
run = [
  "pkill -x chet || true",
  "for i in 1 2 3 4 5; do pgrep -x chet >/dev/null || break; sleep 1; done",
  "./scripts/dedupe-launchservices.sh .build/xc/Build/Products/Debug/chet.app",
  "open -n --env CHET_VERBOSE=1 .build/xc/Build/Products/Debug/chet.app",
]

[tasks.devlog]
description = "Follow the verbose dev activity log (Debug builds only)"
run = '''
LOG="$HOME/Library/Logs/chet/application-debug.log"
DIR="$HOME/Library/Logs/chet"
if [ ! -d "$DIR" ]; then
  echo "chet dev log: $DIR does not exist. If mise run dev already ran, the writer could not create it; check Console for the devlog notice."
  exit 0
fi
if [ ! -e "$LOG" ]; then
  echo "chet dev log: application-debug.log is not created yet. Run mise run dev (Debug builds only); if it already ran, the writer could not open it and logged one devlog notice to Console."
  exit 0
fi
if [ ! -r "$LOG" ]; then
  echo "chet dev log: application-debug.log is not readable by this account. Fix its ownership or permissions, then relaunch mise run dev."
  exit 0
fi
if [ ! -w "$DIR" ]; then
  echo "chet dev log: $DIR is not writable. The app can follow an existing file, but it cannot create a new one or rotate at the cap."
fi
if [ ! -s "$LOG" ]; then
  echo "chet dev log: application-debug.log exists and is empty. A Debug app with CHET_VERBOSE=1 writes launch.started at launch; if the app is running, check Console for the devlog notice."
fi
N=$(pgrep -x chet | wc -l | tr -d ' ')
if [ "$N" -gt 1 ]; then
  echo "chet dev log: $N chet instances are running; lines interleave by session."
fi
echo "chet dev log: following application-debug.log by name (last write $(stat -f '%Sm' -t '%H:%M:%S' "$LOG")); rotation is followed, Ctrl-C stops."
echo "chet dev log: no line after a launch means the running app has no writer (Release build or no CHET_VERBOSE=1)."
exec tail -F "$LOG"
'''

[tasks.test]
description = "Run ChetCore tests (pass a filter: mise run test -- --filter Cleaner)"
run = "swift test --package-path ChetCore"

[tasks.release]
description = "Release build, build number bumped, arm64 check, zipped to dist/chet.zip"
depends = ["gen"]
run = [
  "sh scripts/bump-build.sh",
  "xcodebuild -project chet.xcodeproj -scheme chet-helper -configuration Release -destination 'platform=macOS' -derivedDataPath .build/xc -quiet build",
  "xcodebuild -project chet.xcodeproj -scheme chet -configuration Release -destination 'platform=macOS' -derivedDataPath .build/xc -quiet build",
  "test \"$(lipo -archs .build/xc/Build/Products/Release/chet.app/Contents/MacOS/chet)\" = arm64",
  "test \"$(lipo -archs .build/xc/Build/Products/Release/chet.app/Contents/MacOS/chet-helper)\" = arm64",
  "mkdir -p dist && rm -f dist/chet.zip && ditto -c -k --keepParent .build/xc/Build/Products/Release/chet.app dist/chet.zip",
  "echo dist/chet.zip",
]

[tasks.check]
description = "Tests, debug build, and arm64-only binary check"
depends = ["test", "build"]
run = "test \"$(lipo -archs .build/xc/Build/Products/Debug/chet.app/Contents/MacOS/chet)\" = arm64 && echo arm64 ok"

[tasks.dmg]
description = "Release build packaged as dist/chet.dmg"
depends = ["release"]
run = [
  "rm -rf .build/dmg && mkdir -p .build/dmg",
  "cp -R .build/xc/Build/Products/Release/chet.app .build/dmg/",
  "ln -s /Applications .build/dmg/Applications",
  "mkdir -p dist && rm -f dist/chet.dmg",
  "hdiutil create -volname Chet -srcfolder .build/dmg -ov -format UDZO dist/chet.dmg",
  "hdiutil verify dist/chet.dmg",
  "echo dist/chet.dmg",
]

[tasks.bench]
description = "Benchmark GPU vs SHA-256 duplicate hashing (writes 1 GB of temp files)"
run = "CHET_BENCH=1 swift test --package-path ChetCore --filter hashingBenchmark"

[tasks.layout]
description = "Check floating chrome positions against the registry in docs/DESIGN.md"
run = "python3 scripts/layout_check.py"

[tasks.fmt]
description = "Format all Swift sources in place"
run = "swift format --in-place --recursive Chet ChetCore/Sources ChetCore/Tests ChetCore/Package.swift"

[tasks.lint]
description = "Check Swift formatting without changing files"
run = "swift format lint --strict --recursive Chet ChetCore/Sources ChetCore/Tests ChetCore/Package.swift"

[tasks.xcode]
description = "Open the generated project in Xcode"
depends = ["gen"]
run = "xed chet.xcodeproj"

[tasks.log]
description = "Follow the clean audit log"
run = "tail -f ~/Library/Logs/chet/clean.log"

[tasks.clean]
description = "Remove build output, generated project and dist/"
run = "rm -rf .build ChetCore/.build chet.xcodeproj dist || true"

[tasks.scan-bench]
description = "Read-only scan benchmark (pass a folder: mise run scan-bench -- /path)"
run = "swift run --package-path ChetCore chet-scan"
