name: chet
options:
  fileTypes:
    icon:
      file: true
      buildPhase: resources
      type: folder.iconcomposer.icon
  bundleIdPrefix: id.web.widnyana
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ChetCore:
    path: ChetCore
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  chet:
    type: application
    platform: macOS
    sources:
      - path: Chet
        excludes:
          - "AppIcon.icon"
      - path: Chet/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: ChetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.web.widnyana.chet
        INFOPLIST_FILE: Chet/Info.plist
        CODE_SIGN_ENTITLEMENTS: Chet/Chet.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
