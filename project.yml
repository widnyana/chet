name: chet
options:
  fileTypes:
    icon:
      file: true
      buildPhase: resources
      type: folder.iconcomposer.icon
  bundleIdPrefix: id.web.widnyana
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ChetCore:
    path: ChetCore
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  chet:
    type: application
    platform: macOS
    sources:
      - path: Chet
        excludes:
          - "AppIcon.icon"
          - "LaunchDaemons"
      - path: Chet/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: ChetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.web.widnyana.chet
        INFOPLIST_FILE: Chet/Info.plist
        CODE_SIGN_ENTITLEMENTS: Chet/Chet.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Embed privileged helper
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          APP="$TARGET_BUILD_DIR/$WRAPPER_NAME"
          mkdir -p "$APP/Contents/Library/LaunchDaemons"
          cp "$BUILT_PRODUCTS_DIR/chet-helper" "$APP/Contents/MacOS/chet-helper"
          cp Chet/LaunchDaemons/id.web.widnyana.chet.helper.plist \
            "$APP/Contents/Library/LaunchDaemons/id.web.widnyana.chet.helper.plist"
          ID="${EXPANDED_CODE_SIGN_IDENTITY:-}"
          [ -n "$ID" ] || ID=-
          codesign --force --options runtime --sign "$ID" "$APP/Contents/MacOS/chet-helper"
  chet-helper:
    type: tool
    platform: macOS
    sources:
      - path: ChetHelper
    dependencies:
      - package: ChetCore
    settings:
      base:
        PRODUCT_NAME: chet-helper
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets: []
